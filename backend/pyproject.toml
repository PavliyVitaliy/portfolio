[tool.poetry]
name = "portfolio-backend"
version = "0.1.0"
description = "portfolio backend fast api"
authors = ["Vitalii"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.141.1"
uvicorn = "^0.52.0"
motor = {extras = ["srv"], version = "^3.7.1"}
pydantic-settings = "^2.15.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.52"}
asyncpg = "^0.31.0"
alembic = "^1.19.1"
fastapi-users = {extras = ["sqlalchemy"], version = "^15.0.5"}
odmantic = "^1.1.0"


[tool.poetry.group.dev.dependencies]
black = "^26.5.1"

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
httpx = "^0.28.1"
pytest-asyncio = "^1.4.0"

[tool.pytest.ini_options]
pythonpath = "app"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
