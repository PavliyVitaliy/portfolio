services:
  portfolio-postgres-db-test:
    image: postgres:14.23
    container_name: portfolio-postgres-db-test
    ports:
      - 5433:5432
    restart: always
    env_file:
      - backend/app/.env.test
    networks:
      - portfolio.network.test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  portfolio-mongo-db-test:
    image: mongo:8
    container_name: portfolio-mongo-db-test
    ports:
      - 27018:27017
    restart: always
    env_file:
      - backend/app/.env.test
    volumes:
      - mongo_test_data:/data/db
      - ./mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - portfolio.network.test

  portfolio-backend-test:
    container_name: portfolio-backend-test
    build:
      context: .
      dockerfile: ./backend/Dockerfile.test
    env_file:
      - backend/app/.env.test
    environment:
      MONGO_URI_AUTHORITY_OVERRIDE: portfolio-mongo-db-test:27017
    volumes:
      - ./backend:/code/backend
    depends_on:
      portfolio-postgres-db-test:
        condition: service_started
      portfolio-mongo-db-test:
        condition: service_healthy
    networks:
      - portfolio.network.test
    ports:
      - 8001:8000

  portfolio-proxy-test:
    container_name: portfolio-proxy-test
    build:
      context: .
      dockerfile: ./nginx/proxy.Dockerfile.test
    depends_on:
      - portfolio-backend-test
    networks:
      - portfolio.network.test
    volumes:
      - ./nginx/nginx.proxy.conf:/etc/nginx/nginx.conf
    ports:
      - 81:80
    restart: always

networks:
  portfolio.network.test:
    driver: bridge

volumes:
  mongo_test_data:
  postgres_test_data:
