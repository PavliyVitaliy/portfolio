name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated MongoDB
        run: docker compose -f docker-compose.test.yaml up --detach --wait portfolio-mongo-db-test
      - name: Run API tests
        run: docker compose -f docker-compose.test.yaml run --rm --no-deps --build portfolio-backend-test pytest
      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.test.yaml down --volumes

  production-config:
    name: Production configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.production.yaml config --quiet
